<header class="main-header">

        </a>

        <nav class="main-nav" id="mainNav" aria-label="Main navigation">
            <a href="index.html" data-page="index.html" data-i18n="navAbout">About Us</a>

        <div class="header-actions">
            <div class="lang-dropdown">

                    <li>

                    </li>
                    <li>
                        <button type="button" class="lang-option" data-lang="ru" data-action="redirect-page" role="option" aria-selected="false">
